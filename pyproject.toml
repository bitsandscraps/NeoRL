[project]
name = "neorl"
version = "0.1.0"
description = ""
authors = [
    {name = "bitsandscraps",email = "17763502+bitsandscraps@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gym (>=0.26.2,<0.27.0)",
    "numpy (>=2.4.4,<3.0.0)",
    "pandas (>=3.0.2,<4.0.0)",
    "mujoco-py-cython3 (>=2.1.2.15,<3.0.0.0)",
    "setuptools",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.setuptools.package-data]
neorl = [
    'neorl_envs/finance/trade.csv',
    'neorl_envs/finance/train.csv',
    'neorl_envs/citylearn/data/*',
    'neorl_envs/citylearn/data/Climate_Zone_1/*',
    'neorl_envs/citylearn/data/Climate_Zone_2/*',
    'neorl_envs/citylearn/data/Climate_Zone_3/*',
    'neorl_envs/citylearn/data/Climate_Zone_4/*',
    'neorl_envs/citylearn/data/Climate_Zone_5/*',
    'data_map.json'
]


